[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-ctm"
version = "1.0.0"
description = "Geometry-constrained multi-frame character association for license plate recognition on moving cameras (Sensors 2026, doi:10.3390/s26185704)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Ufuk Asil" }]
keywords = ["alpr", "license-plate-recognition", "video", "multi-frame-fusion", "ransac"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

# Only the fusion core. The benchmark harness needs torch and a checkout of the
# upstream CTM repository — install those with requirements.txt.
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "opencv-python>=4.5",
]

[project.optional-dependencies]
benchmark = ["torch>=1.8", "torchvision>=0.9", "imutils>=0.5.4", "pandas", "matplotlib", "tqdm"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/ufukasia/geo-ctm"
Paper = "https://doi.org/10.3390/s26185704"
Issues = "https://github.com/ufukasia/geo-ctm/issues"

[tool.setuptools]
packages = ["geoctm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
